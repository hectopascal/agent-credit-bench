name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  verl-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # CPU wheel first so the resolver doesn't pull the CUDA build.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # cachetools/uvicorn/fastapi: verl's agent-loop import path needs the
      # server stack that an inference-backend install normally provides.
      - run: pip install -e ".[dev]" "verl==0.9.0" cachetools uvicorn fastapi
      - run: pytest tests/test_verl_integration.py
