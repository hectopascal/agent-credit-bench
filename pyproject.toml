[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-credit-bench"
version = "0.5.0"
description = "Conformance-test suite for turn-level credit estimators, with exact-advantage oracles on tiny finite-horizon MDPs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
experiments = ["matplotlib>=3.8"]
# Scores verl's actual advantage implementations (integrations/verl.py).
# Tested against verl 0.9.0; torch CPU is sufficient.
verl = ["verl>=0.9"]
# Scores TRL's advantage computations (integrations/trl.py).
# Transcribed from and tested against TRL 1.12.0; torch CPU is sufficient.
trl = ["trl>=1.12"]
# Scores OpenRLHF's advantage pipeline (integrations/openrlhf.py).
# Linux-x86_64-only wheels; see docs/openrlhf_integration.md for the
# --no-deps install that avoids the vllm/flash-attn stack.
openrlhf = ["openrlhf>=0.11"]
# Plays suite environments inside verifiers (recipes/verifiers_bridge).
verifiers = ["verifiers>=0.1.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_credit_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
