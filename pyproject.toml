[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-credit-bench"
version = "0.0.1"
description = "Conformance-test suite for turn-level credit estimators, with exact-advantage oracles on tiny finite-horizon MDPs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
experiments = ["matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_credit_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
